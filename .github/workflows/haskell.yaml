name: check
on: [ push ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that has to happen after the repository was created, whoever
  # created it (the course script or the student via "Use this template"):
  # the feedback branch at the template state and the pull request main -> feedback.
  # Idempotent, runs on every push, even the ones marked [no ci].
  provision:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pusher.name, '[bot]') }}
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REPO_NAME: ${{ github.event.repository.name }}
      TEMPLATE: ${{ github.event.repository.template_repository.name }}
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Check the repository name'
        run: |
          if [ -n "$TEMPLATE" ] && [ "$REPO_NAME" != "$TEMPLATE-$ACTOR" ]; then
            echo "::warning::Репозиторий называется '$REPO_NAME', а по правилам курса должен называться '$TEMPLATE-<ваш логин>'."
          fi

      - name: 'Create the feedback branch'
        run: |
          root=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          if git ls-remote --exit-code --heads origin feedback > /dev/null; then
            echo "feedback branch exists"
          else
            git push origin "$root:refs/heads/feedback"
          fi

      - name: 'Open the pull request'
        run: |
          open=$(gh pr list --repo "$REPO" --base feedback --head main --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "pull request exists"
            exit 0
          fi
          root=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          if [ "$(git rev-parse HEAD)" = "$root" ]; then
            echo "nothing to compare yet, the pull request will be opened on the next push"
            exit 0
          fi
          gh pr create --repo "$REPO" --base feedback --head main \
            --title "$REPO_NAME" \
            --body "Здесь появляются отчёты проверки и ревью. Сдача — пуш в main; закрывать этот PR не нужно." \
            || echo "::warning::Не удалось открыть PR, попробуем на следующем пуше."

  hlint:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pusher.name, '[bot]') && !contains(github.event.head_commit.message, '[no ci]') }}
    steps:
      - uses: actions/checkout@v4

      - name: 'Setup HLint'
        uses: haskell-actions/hlint-setup@v2

      - name: 'Run HLint'
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "test/"]'
          fail-on: warning

  tests:
    needs: provision
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pusher.name, '[bot]') && !contains(github.event.head_commit.message, '[no ci]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: 'Setup GHC and cabal'
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.14'

      - name: 'Cache dependencies'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.10.3-${{ hashFiles('cabal.project.freeze', 'homework.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.10.3-

      - name: 'Update package index'
        run: cabal update

      - name: 'Build all'
        run: cabal build all --enable-tests

      - name: 'Run tests'
        id: run-tests
        continue-on-error: true
        env:
          HASKELL_TEST_REPORT_JSON: report.json
        run: cabal test homework-test --test-show-details=direct --test-options="$(cat solved-tasks.txt)"

      - name: 'Complete report.json'
        env:
          HW: ${{ github.event.repository.name }}
          LOGIN: ${{ github.actor }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # The test runner did not even start (build of tests failed, etc.): keep the shape.
          if [ ! -f report.json ]; then
            echo '{"tasks":[],"level1_closed":false}' > report.json
          fi
          case "$MESSAGE" in
            submit:*) KIND=submit ;;
            tmp*|"[no ci] tmp"*) KIND=tmp ;;
            *) KIND=other ;;
          esac
          HOURS=null
          if [ -f hours.txt ]; then
            VALUE=$(tr -d '[:space:]' < hours.txt | tr ',' '.')
            if echo "$VALUE" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
              HOURS=$VALUE
            fi
          fi
          jq --arg hw "$HW" --arg login "$LOGIN" --arg sha "$SHA" --arg kind "$KIND" --argjson hours "$HOURS" \
            '. + {hw: $hw, login: $login, sha: $sha, kind: $kind, hours: $hours}' \
            report.json > report.tmp.json
          mv report.tmp.json report.json
          cat report.json

      - name: 'Render report'
        run: |
          {
            echo '| Task | Level | Status |'
            echo '|------|-------|--------|'
            jq -r '.tasks[] | "| \(.id) | \(.level // "-") | \(.status)\(if .progress != null then " (\(.progress * 100 | floor)%)" else "" end) |"' report.json
            echo
            jq -r 'if .level1_closed then "**Level 1: closed**" else "**Level 1: open**"  end' report.json
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo '## Homework report'
            echo
            cat report.md
            echo
            echo '<details><summary>report.json</summary>'
            echo
            echo '```json'
            jq . report.json
            echo '```'
            echo
            echo '</details>'
          } > comment.md

      - name: 'Comment on the pull request'
        if: github.event_name == 'push'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: hw-report
          path: comment.md

      - name: 'Propagate test result'
        if: steps.run-tests.outcome == 'failure'
        run: |
          echo 'Some tests failed, see the report above.'
          exit 1
